[project]
name = "nyc311-pulse"
version = "1.0.0"
description = "Evidence-first anomaly triage for NYC 311 service requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.3",
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pydantic==2.12.5",
  "statsmodels==0.14.6",
  "uvicorn==0.40.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics*", "api*"]

[dependency-groups]
dev = [
  "dbt-duckdb==1.10.0",
  "pyright==1.1.408",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.11",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["analytics", "api"]
